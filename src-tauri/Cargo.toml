[package]
name = "devops-days-presentation"
version = "0.1.0"
description = "A Tauri wrapper for the DevOps Days presentation"
authors = ["Presentation"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "devops_days_presentation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
log = "0.4"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-log = "2"
